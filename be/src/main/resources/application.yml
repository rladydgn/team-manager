spring:
  application:
    name: team-manager
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  exposed:
    show-sql: true

server:
  tomcat:
    threads:
      max: 40

app:
  team-logo:
    storage-path: ${TEAM_LOGO_STORAGE_PATH:./uploads/team-logos}
  jwt:
    secret: ${JWT_SECRET}
    issuer: team-manager
    access-token-expiration: 15m
    refresh-token-expiration: 7d
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/api/oauth/kakao/callback}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
