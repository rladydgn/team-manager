name: Deploy to EC2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build backend
        working-directory: be
        env:
          APPLICATION_REAL: ${{ secrets.APPLICATION_REAL }}
        run: |
          printf '%s' "$APPLICATION_REAL" > src/main/resources/application-real.yml
          chmod +x gradlew
          SPRING_PROFILES_ACTIVE=real ./gradlew bootJar

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Build frontend
        working-directory: fe
        env:
          FRONTEND_REAL_ENV: ${{ secrets.FRONTEND_REAL_ENV }}
        run: |
          printf '%s' "$FRONTEND_REAL_ENV" > .env.production
          npm ci
          npm run build

      - name: Prepare deployment files
        run: |
          mkdir -p deploy/backend deploy/frontend/.next
          cp "$(find be/build/libs -maxdepth 1 -type f -name 'team-manager-*.jar' ! -name '*-plain.jar')" deploy/backend/team-manager.jar
          cp -R fe/.next/standalone/. deploy/frontend/
          cp -R fe/.next/static deploy/frontend/.next/static
          if [ -d fe/public ]; then cp -R fe/public deploy/frontend/public; fi

      - name: Deploy and restart services on EC2
        uses: easingthemes/ssh-deploy@main
        with:
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_PORT: 22
          SOURCE: "deploy/"
          TARGET: ${{ secrets.DEPLOY_PATH }}
          SCRIPT_AFTER: |
            set -eu
            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            cd "$APP_DIR"
            mkdir -p logs

            if [ -f backend.pid ] && kill -0 "$(cat backend.pid)" 2>/dev/null; then
              kill "$(cat backend.pid)"
            fi
            if [ -f frontend.pid ] && kill -0 "$(cat frontend.pid)" 2>/dev/null; then
              kill "$(cat frontend.pid)"
            fi

            export SPRING_PROFILES_ACTIVE=real
            nohup java -jar backend/team-manager.jar > logs/backend-access.log 2> logs/backend-error.log &
            echo $! > backend.pid

            cd frontend
            nohup node server.js > ../logs/frontend-access.log 2> ../logs/frontend-error.log &
            echo $! > ../frontend.pid
